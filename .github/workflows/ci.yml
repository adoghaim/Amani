name: CI

on:
  pull_request:
    branches: [main, feature/amani-intelligence-v2]
  push:
    branches: [main, feature/amani-intelligence-v2]

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. A push gets a group
  # of its own commit: GitHub cancels a pending run whenever another run queues
  # in the same group, even without cancel-in-progress, so one group per branch
  # dropped the results of merge commits that landed close together.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  functions:
    name: Edge function typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Supabase resolves npm:/jsr:/https: imports at deploy time, so a range
      # or bare major would let production code change without a commit.
      # Plain node, no dependencies: runs before the Deno check.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Pinned edge-function imports (checker tests)
        run: node --test tools/supply-chain/pinned-imports.test.mjs

      - name: Pinned edge-function imports
        run: node tools/supply-chain/check-pinned-imports.mjs

      # The Deno of the Supabase edge runtime (supabase/edge-runtime v1.77.8,
      # deno/Cargo.toml), so the check sees what production runs. Keep it equal
      # to check:functions in package.json.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.1.4

      - name: Check edge functions (baseline ratchet)
        run: bash docs/check-functions.sh deno

  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Clinical catalog validation tests (no git history)
        run: npm run clinical:test:ci

      - name: Clinical catalog drift
        run: npm run clinical:check

      - name: Offline release automation tests
        run: bash tools/release/check.sh

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Contrast validation
        run: npm run validate:contrast

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  migrations:
    name: Migration behaviour (Postgres)
    runs-on: ubuntu-latest
    # The full V2 harness (clinical catalog, quarantine, versioning sections) takes
    # ~45 minutes on a developer machine; 10 minutes timed out before it could
    # even start those sections.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # The harness runs the live SQL->TypeScript parity checks through Vitest
      # (legacy-quarantine.run.sh, interpretation-versions.run.sh). Without the
      # workspace dependencies it exits silently at `test -x node_modules/.bin/vitest`
      # right after the pre-V2 sections, which is why this job reported failure on
      # every V2 branch run while reporting success on main (which lacked those
      # sections). A configured gate is not evidence that the gate executed.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # `introductory_deep_access_claims` is a money-related, concurrency-
      # sensitive table: it decides who gets a paid AI interpretation for free.
      # Reading the SQL is not enough — the first version of that migration
      # passed review and would have broken `DELETE FROM lab_reports` in
      # production, because ON DELETE SET NULL is an UPDATE and the immutability
      # trigger rejected it. Only running it caught that. This job keeps the
      # constraint, trigger and advisory-lock behaviour under test permanently.
      #
      # ubuntu-latest ships Docker, so no setup step is needed.
      - name: Verify migration behaviour
        run: ./supabase/migrations/__verification__/run.sh
