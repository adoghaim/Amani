project_id = "eyfvqdnczorscwveaadv"

# Functions that authenticate the request themselves. They run their own
# `supabase.auth.getUser()` check and a 401 path; setting verify_jwt = false
# is intentional, not an oversight.
[functions.extract-biomarkers]
verify_jwt = false

[functions.parse-lab-report-ocr]
verify_jwt = false

[functions.generate-interpretation]
verify_jwt = false

# Stripe-signed webhook. Stripe sends a `stripe-signature` header instead of a
# Supabase JWT, so verify_jwt MUST be false or every event will 401 before we
# can verify the signature.
[functions.stripe-webhook]
verify_jwt = false

# Authenticated client → checkout/portal flows. Each function additionally
# calls `auth.getUser()` itself; verify_jwt = true is the gateway-level check.
[functions.stripe-checkout]
verify_jwt = true

[functions.create-portal-session]
verify_jwt = true
