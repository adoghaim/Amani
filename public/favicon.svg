<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Amani">
  <!-- Cycle mark: the ring is the full cycle, the arc is elapsed days, the dot
       is today. Same idea as the dashboard dial, reduced until it survives 16px.

       NOTE: this still carries the cycle geometry, not the brand "A" mark used
       everywhere else in the identity. The supplied brand artwork is raster
       only, and tracing it here would amount to redrawing the logo. Colours are
       on the brand palette so the tab is at least chromatically consistent;
       replace this file wholesale once a vector master of the mark exists.
       See public/brand/ for the raster set. -->
  <rect width="32" height="32" rx="7" fill="#FBF7F5"/>
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#E1C1D0" stroke-width="3.5"/>
  <path d="M16 6.5 a9.5 9.5 0 0 1 8.15 14.4" fill="none" stroke="#95617C"
        stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="24.15" cy="20.9" r="2.9" fill="#0D2033"/>
</svg>
