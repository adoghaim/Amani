name: E2E smoke

# Owner ruling (PR #93, pre-launch): "browser smoke becomes a required automated
# check when the CI upgrade is online". PR #96 brought that upgrade online, so
# this job now runs on every PR into main AND on every push to main, which is
# what lets the owner mark the emitted `Browser smoke` check as required in
# branch protection. Changing branch protection is an owner action in GitHub
# settings; nothing in this repository can (or should) change it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  # Superseded PR pushes are cancelled to save minutes; runs on main are never
  # cancelled, so every merge commit keeps its own Browser smoke result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    # Keep this name stable: it is the status-check name branch protection uses.
    name: Browser smoke
    runs-on: ubuntu-latest
    # 183 specs across three browsers on two workers ran past 15 minutes once the
    # 2026-10-15 merge train landed (124 passed, none failed, when it was cut off).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # Browser binaries are keyed on the lockfile, so a cache hit is always the
      # exact revision the locked Playwright 1.62.1 expects. OS packages are not
      # cacheable and are installed on every run.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install matching browsers and OS dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx --no-install playwright install --with-deps chromium webkit firefox
      - name: Install OS dependencies for cached browsers
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx --no-install playwright install-deps chromium webkit firefox
      - name: Verify E2E environment isolation
        run: npm run test:e2e:isolation
      - name: Run isolated synthetic smoke tests
        run: npm run test:e2e
      - name: Run isolated freemium regressions
        run: npx --no-install playwright test --config e2e/freemium/playwright.config.ts
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  journey:
    # PK-03e-I: the fresh-user journey against the production build (vite
    # preview), flag on, three engines, in-memory Supabase stand-in. Its own
    # status check, parallel to Browser smoke.
    name: Fresh-user journey
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install matching browsers and OS dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx --no-install playwright install --with-deps chromium webkit firefox
      - name: Install OS dependencies for cached browsers
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx --no-install playwright install-deps chromium webkit firefox
      - name: Real-stack mode refuses a hosted project
        run: npm run test:e2e:journey:guard
      - name: Fresh-user journey (production build, three browsers)
        run: npm run test:e2e:journey
      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: journey-failure-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
