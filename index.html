<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Amani — understand your lab results</title>
    <meta name="description" content="Amani reads your hormone and blood panels, scores them against where you are in your cycle, and explains what they mean in plain language — so you can have a better conversation with your doctor." />
    <meta name="theme-color" content="#FBF7F5" />

    <!-- Raster brand marks first, then the scalable fallback. The PNGs carry the
         real Amani mark; favicon.svg still carries the cycle geometry until a
         vector master exists (see the note inside that file). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon-64.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />

    <!-- Fonts are bundled via @fontsource, not linked: capacitor.config.ts locks
         allowNavigation to Supabase and Stripe, so a font <link> silently falls
         back to system type on device. See src/styles/fonts.css. -->

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Amani" />
    <meta property="og:url" content="https://amanibiometrics.com/" />
    <meta property="og:title" content="Amani — understand your lab results" />
    <meta property="og:description" content="Hormone and blood panels, read against your cycle and explained in plain language." />
    <meta property="og:image" content="https://amanibiometrics.com/brand/amani-app-icon-light.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Amani — understand your lab results" />
    <meta name="twitter:description" content="Hormone and blood panels, read against your cycle and explained in plain language." />
    <meta name="twitter:image" content="https://amanibiometrics.com/brand/amani-app-icon-light.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
