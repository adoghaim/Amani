project_id = "eyfvqdnczorscwveaadv"

# Functions that authenticate the request themselves. They run their own
# `supabase.auth.getUser()` check and a 401 path; setting verify_jwt = false
# is intentional, not an oversight.
[functions.extract-biomarkers]
verify_jwt = false

[functions.parse-lab-report-ocr]
verify_jwt = false

[functions.generate-interpretation]
verify_jwt = false

# Stripe-signed webhook. Stripe sends a `stripe-signature` header instead of a
# Supabase JWT, so verify_jwt MUST be false or every event will 401 before we
# can verify the signature.
[functions.stripe-webhook]
verify_jwt = false

# RevenueCat webhook. RevenueCat sends the shared secret from the dashboard in
# the `Authorization` header, not a Supabase JWT, so verify_jwt MUST be false
# or every delivery 401s at the gateway before the handler can check it. Same
# reasoning as stripe-webhook above: the function authenticates itself, and it
# fails closed when REVENUECAT_WEBHOOK_AUTH is unset.
[functions.iap-webhook]
verify_jwt = false

# Authenticated client → checkout/portal/purchase-verification flows. Each
# function additionally calls `auth.getUser()` itself; verify_jwt = true is the
# gateway-level check.
[functions.stripe-checkout]
verify_jwt = true

[functions.create-portal-session]
verify_jwt = true

# Called by the app right after a store purchase or a restore. The user id is
# taken from this JWT, never from the request body.
[functions.verify-iap-purchase]
verify_jwt = true

[functions.get-interpretation]
verify_jwt = true

# Single-report deletion (PK-FIX-04). The report id is checked against the
# caller from this JWT (RLS read), never trusted from the body alone; the
# function also calls `auth.getUser()` itself.
[functions.delete-report]
verify_jwt = true

# PK-FIX-01b scheduled AI budget check. Called by the owner's scheduler, not by
# the app: it authenticates the caller itself with the x-amani-scheduler-secret
# header against AI_BUDGET_CHECK_SECRET, and refuses every call while that
# secret is unset. verify_jwt = false so the scheduler needs no user JWT.
[functions.ai-budget-check]
verify_jwt = false
